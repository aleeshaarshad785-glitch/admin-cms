<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phones Master - Mobile Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-wide">Phones Master</h1>
      <a href="https://wa.me/" target="_blank" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-semibold text-sm transition">
        WhatsApp Us
      </a>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-slate-800 text-white py-12 text-center px-4">
    <h2 class="text-3xl font-extrabold mb-2">Your Trusted Mobile Shop</h2>
    <p class="text-gray-300 max-w-md mx-auto text-sm">Find verified, checked & original smartphones at the best prices.</p>
  </section>

  <!-- Products Section -->
  <main class="max-w-6xl mx-auto p-6">
    <h3 class="text-xl font-bold mb-6 border-b pb-2">Available Smartphones</h3>
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <p class="col-span-full text-center text-gray-500 py-10">Loading products...</p>
    </div>
  </main>

  <!-- Script to Fetch CMS Products -->
  <script>
    async function fetchProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const response = await fetch('https://api.github.com/repos/aleeshaarshad785-glitch/admin-cms/contents/content/phones');
        
        if (!response.ok) {
          grid.innerHTML = '<p class="col-span-full text-center text-gray-500">No products added yet. Add entries via CMS.</p>';
          return;
        }

        const files = await response.json();
        grid.innerHTML = '';

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const text = await res.text();
            
            // Frontmatter parser
            const match = text.match(/---([\s\S]*?)---/);
            if (match) {
              const yaml = match[1];
              const getVal = (key) => {
                const m = yaml.match(new RegExp(`${key}:\\s*"(.*?)"`)) || yaml.match(new RegExp(`${key}:\\s*(.*)`));
                return m ? m[1].replace(/^"|"$/g, '').trim() : '';
              };

              const title = getVal('title');
              const brand = getVal('brand');
              const price = getVal('price');
              const specs = getVal('specs');
              const condition = getVal('condition');
              const image = getVal('image');

              const card = `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                  <div class="h-48 bg-gray-200 overflow-hidden flex items-center justify-center">
                    ${image ? `<img src="${image}" class="w-full h-full object-contain p-2">` : '<span class="text-gray-400">No Image</span>'}
                  </div>
                  <div class="p-4">
                    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded-full">${brand}</span>
                    <h4 class="text-lg font-bold mt-2">${title}</h4>
                    <p class="text-xs text-gray-500 mt-1">${specs} • ${condition}</p>
                    <div class="mt-4 flex items-center justify-between">
                      <span class="text-lg font-extrabold text-slate-900">PKR ${price}</span>
                      <a href="https://wa.me/?text=Hi%20Phones%20Master,%20I%20want%20to%20buy%20${encodeURIComponent(title)}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-2 rounded-md font-semibold">
                        Buy Now
                      </a>
                    </div>
                  </div>
                </div>
              `;
              grid.innerHTML += card;
            }
          }
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p class="col-span-full text-center text-red-500">Failed to load products.</p>';
      }
    }

    fetchProducts();
  </script>
</body>
</html>
